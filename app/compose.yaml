services:
    db:
        image: mariadb:11
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: lottery
            MARIADB_USER: lottery
            MARIADB_PASSWORD: lottery
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5

    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        env_file:
            - .env
        environment:
            PORT: 3000
            NS_MARIADB_HOSTNAME: db
            NS_MARIADB_DATABASE: lottery
            NS_MARIADB_USER: lottery
            NS_MARIADB_PORT: 3306
            NS_MARIADB_PASSWORD: lottery
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://localhost:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10

    client:
        build:
            context: .
            dockerfile: client/Dockerfile
        ports:
            - "4173:4173"
        restart: unless-stopped
        environment:
            - SSR_API_ORIGIN=http://server:3000
            - SSG_CACHE_DIR=/app/cache
        volumes:
            - ssg-cache:/app/cache
        depends_on:
            server:
                condition: service_healthy

volumes:
    db-data:
    ssg-cache:
